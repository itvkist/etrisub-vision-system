<!-- templates/frames.html -->
{% extends "base.html" %}

{% block title %}Camera {{ camera_id }} Analysis{% endblock %}

{% block content %}
<div class="header">
    <a href="/" class="back-button">← Back to Cameras</a>
    <h1>Camera {{ camera_id }} Detailed Analysis</h1>
    <button onclick="refreshAnalysis()" class="refresh-button">Refresh Analysis</button>
</div>

<div class="analysis-container">
    <div id="analysis-content" class="loading">
        Loading analysis...
    </div>
</div>

<!-- Pass camera_id as a data attribute -->
<div id="camera-data" data-camera-id="{{ camera_id }}"></div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/frames.js') }}"></script>
{% endblock %}
